# MedWatch Electron Builder configuration. Installer variant
# (dmg on macOS, NSIS on Windows).

appId: com.medwatch.desktop.installer
productName: MedWatch

# Fail the build if the bundled drug catalog is missing or empty.
beforeBuild: build-hooks.js

directories:
  output: dist

# Source files that ship inside the asar bundle. The Next.js static export
# is shipped as an extra resource (below) instead of in the asar so the
# bundled Flask backend can serve it from disk over the loopback port.
files:
  - main/**
  - preload/**
  - package.json

# macOS build. Unsigned (no paid certificate); the bundled Python backend is
# a native binary built per architecture by PyInstaller.
mac:
  category: public.app-category.medical
  target:
    - dmg
    - zip
  artifactName: MedWatch-${version}-${arch}.${ext}
  identity: null
  extraResources:
    - from: resources/renderer
      to: renderer
    - from: resources/drugs.db
      to: drugs.db
    - from: resources/medwatch-backend
      to: medwatch-backend

# Windows build (produced natively in CI; the Windows backend .exe is built
# on a Windows runner because PyInstaller does not cross-compile).
win:
  target: nsis
  extraResources:
    - from: resources/renderer
      to: renderer
    - from: resources/drugs.db
      to: drugs.db
    - from: resources/medwatch-backend.exe
      to: medwatch-backend.exe

# NSIS installer behavior. Lets the user pick the install directory and
# creates desktop plus start menu shortcuts.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MedWatch
