# MedWatch Electron Builder configuration. Portable variant
# (zip on macOS, single portable exe on Windows).

appId: com.medwatch.desktop.portable
productName: MedWatch

# Fail the build if the bundled drug catalog is missing or empty.
beforeBuild: build-hooks.js

directories:
  output: dist

# Source files that ship inside the asar bundle. The Next.js static export
# is shipped as an extra resource (below) so the bundled Flask backend can
# serve it from disk over the loopback port.
files:
  - main/**
  - preload/**
  - package.json

# macOS portable build: a zipped .app the user can run from anywhere.
mac:
  category: public.app-category.medical
  target:
    - zip
  artifactName: MedWatch-${version}-portable-${arch}.${ext}
  identity: null
  extraResources:
    - from: resources/renderer
      to: renderer
    - from: resources/drugs.db
      to: drugs.db
    - from: resources/medwatch-backend
      to: medwatch-backend

# Windows portable single executable (produced natively in CI).
win:
  target: portable
  extraResources:
    - from: resources/renderer
      to: renderer
    - from: resources/drugs.db
      to: drugs.db
    - from: resources/medwatch-backend.exe
      to: medwatch-backend.exe

# Portable single executable. The file name embeds the version so a user can
# keep multiple builds side by side without renaming.
portable:
  artifactName: MedWatch-${version}-portable.exe
